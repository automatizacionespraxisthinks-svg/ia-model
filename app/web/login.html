<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praxis IA · Admin · Login</title>
  <link rel="stylesheet" href="/admin/static/styles.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <header class="login-header">
      <div class="logo-dot"></div>
      <h1>Praxis IA Model</h1>
      <p class="subtitle">Panel de administración</p>
    </header>

    <form id="login-form" autocomplete="off" novalidate>
      <label for="username">Usuario</label>
      <input
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        required
        autofocus
      />

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      />

      <button type="submit" id="submit-btn">Ingresar</button>

      <p id="error-msg" class="error hidden"></p>
    </form>

    <footer class="login-footer">
      <small>Acceso restringido · uso interno</small>
    </footer>
  </main>

  <script src="/admin/static/login.js"></script>
</body>
</html>
